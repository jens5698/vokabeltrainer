name: APK bauen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests und APK bauen
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk Vokabeltrainer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Vokabeltrainer-APK
          path: Vokabeltrainer.apk

      - name: Release veröffentlichen
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Vokabeltrainer 1.0.${{ github.run_number }}
          files: Vokabeltrainer.apk
          make_latest: true
